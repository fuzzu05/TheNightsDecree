name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 7 minutes
    - cron: '*/7 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: curl -s https://thenightsdecree.onrender.com > /dev/null
